; Sample llama-server router preset file (llama-server --models-preset format).
;
; Copy this to local/models.ini (or anywhere, then set LLAMA_PRESET) and edit
; it for your own models and memory. start-llama-ini.cmd / .sh use
; local/models.ini when it exists and fall back to this file.
;
; NAMING: name each primary preset after its GGUF file, without .gguf or a
; -0000N-of-0000N shard suffix. Extra presets on the same file add a suffix.
;
; RULES
; - Use ABSOLUTE model paths. The path below is an example: point it at
;   wherever your GGUF files are (Linux/macOS: /home/you/models/... ).
; - Presets are validated only when a request spawns them; edits apply on the
;   next cold start. Check what is in effect with GET /props and GET /slots.
; - c is the TOTAL KV budget; parallel splits it unless kv-unified = true.
; - cache-ram is host RAM, filled lazily, and NOT counted by the router's
;   --models-memory-margin. Keep it modest when several models stay loaded.
; - On a discrete GPU, ngl = 999 works only if weights + KV fit in VRAM; for
;   bigger models see AGENTS.md section 1b (n-cpu-moe, partial offload).

version = 1

; ---- global defaults; a preset's own key overrides ------------------------
[*]
ngl                = 999      ; full GPU offload
fa                 = on
jinja              = true     ; tool calling breaks without it
cache-reuse        = 256
sleep-idle-seconds = 900      ; idle presets free their memory


; ---- Qwen2.5-Coder 0.5B Instruct Q4_K_M: a tiny smoke-test model -----------
; Dense 0.5B, 24 layers, GQA with 2 KV heads of 64 dims: 12 KiB of f16 KV per
; token. Native context 32768. Small enough for almost any machine:
; 0.4 GB weights + 384 MiB KV at 32K + compute ~ 1.5 GiB (estimate).
; Meant to check the router works, not for real coding work.
; Download (from the repo root):
;   hf download unsloth/Qwen2.5-Coder-0.5B-Instruct-GGUF Qwen2.5-Coder-0.5B-Instruct-Q4_K_M.gguf --local-dir models
[Qwen2.5-Coder-0.5B-Instruct-Q4_K_M]
model     = C:/Models/models/Qwen2.5-Coder-0.5B-Instruct-Q4_K_M.gguf
parallel  = 1
c         = 32768
cache-ram = 512
